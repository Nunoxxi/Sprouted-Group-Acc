# Render deployment for the Next.js app.
#
# Migrations run at the front of startCommand — after a successful build,
# immediately before the new code serves — rather than in buildCommand,
# which would migrate on every build including ones that then fail. The
# free tier has no preDeployCommand; on a paid instance move it there. A
# failed migration stops the start, so the previous deploy stays live.
#
# DATABASE_URL and DIRECT_URL are set in the Render dashboard (sync: false),
# never in this file. See .env.example for which Supabase string is which.
services:
  - type: web
    name: sprouted-accounting
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    # The sign-in page answers 200 without a session; / redirects to it.
    healthCheckPath: /sign-in
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Authentication (Better Auth). Generate the secret with: openssl rand -base64 32
      - key: BETTER_AUTH_SECRET
        sync: false
      # The public URL of the service; invite and reset links are built from it.
      - key: BETTER_AUTH_URL
        sync: false
      # Outbound email for invitations and password resets (Resend). Required in
      # production: an invite with no transport fails rather than vanishing.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Where ledger export files are written. On the free plan the disk is
      # ephemeral, so exports vanish on redeploy; attach a Render Disk and
      # point this at its mount path for exports that persist.
      - key: EXPORT_DIR
        value: /opt/render/project/exports
