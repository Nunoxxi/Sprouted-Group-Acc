{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1>Companies</h1>
    {% if session.get('role') in ['admin', 'accountant'] %}
        <a class="button" href="{{ url_for('companies_add') }}">Add company</a>
    {% endif %}
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Code</th>
            </tr>
        </thead>
        <tbody>
            {% for company in companies %}
            <tr>
                <td>{{ company['name'] }}</td>
                <td>{{ company['company_type'] }}</td>
                <td>{{ company['code'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
