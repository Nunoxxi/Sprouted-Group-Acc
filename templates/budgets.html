{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1>Project budgets</h1>
</div>

<div class="card narrow">
    <form method="post">
        <label>Company</label>
        <select name="company_id" required>
            {% for company in user_companies %}
                <option value="{{ company['id'] }}" {% if selected_company_id == company['id'] %}selected{% endif %}>{{ company['name'] }}</option>
            {% endfor %}
        </select>

        <label>Project / programme</label>
        <select name="project_name">
            {% for project in project_options %}
                <option value="{{ project['name'] }}">{{ project['name'] }}</option>
            {% endfor %}
        </select>

        <label>Funding type</label>
        <select name="fund_type">
            <option value="unrestricted">Unrestricted</option>
            <option value="restricted">Restricted</option>
        </select>

        <label>Budget amount</label>
        <input type="number" step="0.01" name="budget_amount" required>

        <button type="submit">Save budget</button>
    </form>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Project</th>
                <th>Funding</th>
                <th>Budget</th>
            </tr>
        </thead>
        <tbody>
            {% for row in budgets %}
            <tr>
                <td>{{ row['project_name'] }}</td>
                <td>{{ row['fund_type']|title }}</td>
                <td>£{{ '%.2f' % row['budget_amount'] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3">No project budgets yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
